services:
  # Servicio de Aplicación PHP 8.3 FPM
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mikrohn_saas_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8085}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mikrohn_saas}
      DB_USERNAME: ${DB_USERNAME:-mikrohn_user}
      DB_PASSWORD: ${DB_PASSWORD:-mikrohn_password}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - mikrohn_saas_net

  # Servidor Web Nginx
  webserver:
    image: nginx:alpine
    container_name: mikrohn_saas_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8085}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mikrohn_saas_net

  # Base de Datos MySQL 8.0
  database:
    image: mysql:8.0
    container_name: mikrohn_saas_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mikrohn_saas}
      MYSQL_USER: ${DB_USERNAME:-mikrohn_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mikrohn_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${FORWARD_DB_PORT:-3308}:3306"
    volumes:
      - saas_mysql_data:/var/lib/mysql
    networks:
      - mikrohn_saas_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  saas_mysql_data:
    driver: local

networks:
  mikrohn_saas_net:
    driver: bridge
